<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{BRAND_NAME}}</title>
  </head>
  <body>
    <section>
      <a class="t" href="/"
        ><h1><img src="{{LOGO_PATH}}" width="48" />{{BRAND_NAME}}</h1></a
      >
      <p class="moji">😪</p>
      <p>{{CONTENT}}</p>
      <span
        >Docs and Source:
        <a href="{{REPO_URL}}">{{REPO_LABEL}}</a></span
      >
    </section>
    <style>
      body {
        background: {{BACKGROUND_COLOR}};
        color: #fff;
      }
      h1 {
        color: {{PRIMARY_COLOR}};
        text-shadow: {{BACKGROUND_SHADOW_COLOR}} 2px 2px 0px;
        font-size: 3rem;
        margin: 1rem auto;
        flex-wrap: wrap;
        display: flex;
        align-items: flex-start;
        gap: 1rem;
      }
      section {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: 1rem;
        gap: 0.5rem;
        background: {{BACKGROUND_LIGHTER_COLOR}};
        box-shadow: {{BACKGROUND_SHADOW_COLOR}} 4px 4px 0px;
        border-radius: 8px;
        padding: 1rem;
        max-width: 800px;
        margin: 1rem auto;
      }
      p {
        font-size: 1.2rem;
      }
      a {
        color: {{PRIMARY_COLOR}};
        font-family: monospace;
      }
      a.t {
        text-decoration: none;
        margin: 0;
      }
      span {
        opacity: 0.8;
        font-size: 0.85rem;
      }
      h1 {
        font-family:
          PTMono,
          Ubuntu,
          Fira Sans,
          Helvetica,
          sans-serif;
      }
      p,
      span,
      a,
      section,
      div {
        font-family: source-code-pro, Menlo, Monaco, Consolas, 'Courier New', monospace;
      }
      code {
        color: {{PRIMARY_COLOR}};
      }
      .moji {
        font-size: 8rem;
        margin: 0;
      }
    </style>
  </body>
</html>
