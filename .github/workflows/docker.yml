name: 🐳 Build + Publish Docker Images

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - '*'
    paths:
      - src/**
      - api/**
      - public/**
      - vendor/cyberbro/**
      - docker-compose.yml
      - Dockerfile
      - .github/workflows/docker.yml

permissions:
  contents: read
  packages: write

env:
  GHCR_REGISTRY: ghcr.io

jobs:
  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - image_name: web-check
            context: .
            file: ./Dockerfile
          - image_name: web-check-cyberbro
            context: ./vendor/cyberbro
            file: ./vendor/cyberbro/Dockerfile
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v6

      - name: Prepare image metadata 🧾
        shell: bash
        run: |
          echo "GIT_TAG=$(echo ${GITHUB_REF#refs/tags/} | sed 's/\//_/g')" >> $GITHUB_ENV
          echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Compute GHCR tag 🔖
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
            echo "GHCR_TAG=${GHCR_REGISTRY}/${OWNER_LC}/${{ matrix.image.image_name }}:latest" >> $GITHUB_ENV
          else
            echo "GHCR_TAG=${GHCR_REGISTRY}/${OWNER_LC}/${{ matrix.image.image_name }}:${GIT_TAG}" >> $GITHUB_ENV
          fi

      - name: Set up QEMU 🐧
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx 🐳
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry 🔑
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image 🛠️
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          push: true
          platforms: linux/amd64,linux/arm64/v8
          tags: ${{ env.GHCR_TAG }}
